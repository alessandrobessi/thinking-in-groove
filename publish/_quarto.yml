project:
  type: book

book:
  title: "Thinking in Groove"
  subtitle: "Designing Bass Lines Through Harmony, Motion, and Time"
  author: "Alessandro Bessi"
  cover-image: assets/cover.png
  chapters:
    - index.qmd
    - preface.qmd
    - about-the-author.qmd
    - part: "Part I — Role: What Is the Bass Responsible For?"
      chapters:
        - chapters/part-1-role/01-the-ground.md
        - chapters/part-1-role/02-the-definer.md
        - chapters/part-1-role/03-the-inverter.md

format:
  html:
    theme: cosmo
    toc: false
    number-sections: false
    include-in-header:
      - assets/notation-head.html
  typst:
    toc: true
    toc-depth: 1
    number-sections: false
    template-partials:
      - typst-show.typ
    include-before-body:
      - part-style.typ
  epub:
    toc: true
    toc-depth: 1
    # epub-cover-image: assets/cover-epub.png  # cover.png is dense/diagram-heavy; needs an EPUB-specific crop first, see assets/README.md
