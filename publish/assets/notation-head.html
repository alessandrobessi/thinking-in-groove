<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<style>
.score-example {
  min-width: 0;
  margin: 1.75em 0;
  padding: 1rem;
  border: 1px solid #d8d3c8;
  border-radius: 10px;
  background: #fbf9f5;
}
.score-example .abc-source { display: none; }
.score-example .abc-rendered {
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-inline: contain;
  scrollbar-gutter: stable;
  touch-action: pan-x pan-y;
}
.score-example .abc-rendered svg {
  display: block;
  min-width: 620px;
  width: auto;
  max-width: none !important;
  height: auto;
}
.score-example .abc-rendered.is-scrollable {
  padding-bottom: .35rem;
  scrollbar-color: #9e442a #e6e0d6;
  scrollbar-width: auto;
}
.score-example .abc-rendered.is-scrollable::-webkit-scrollbar {
  height: 12px;
}
.score-example .abc-rendered.is-scrollable::-webkit-scrollbar-track {
  border-radius: 999px;
  background: #e6e0d6;
}
.score-example .abc-rendered.is-scrollable::-webkit-scrollbar-thumb {
  border: 2px solid #e6e0d6;
  border-radius: 999px;
  background: #9e442a;
}
.score-example .abc-rendered:focus-visible {
  outline: 3px solid #f0a78e;
  outline-offset: 2px;
}
.score-example .abcjs-title,
.score-example .abcjs-composer,
.score-example .abcjs-tempo { display: none; }
.score-example .abc-caption { margin: 0 0 .55rem; color: #5f5a50; }
.score-example .abc-description { font-size: .9rem; }
.score-example .abc-transport {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .45rem;
  margin-top: .65rem;
}
.score-example button,
.comparison-controls button {
  min-height: 2.35rem;
  padding: .35rem .75rem;
  border: 1px solid #9e442a;
  border-radius: 999px;
  background: #fff;
  color: #843820;
  cursor: pointer;
}
.score-example button:hover:not(:disabled),
.score-example button[aria-pressed="true"],
.comparison-controls button[aria-pressed="true"] { background: #9e442a; color: #fff; }
.score-example button:focus-visible,
.comparison-controls button:focus-visible { outline: 3px solid #f0a78e; outline-offset: 2px; }
.score-example button:disabled { cursor: default; opacity: .55; }
.abcjs-note.is-sounding, .abcjs-rest.is-sounding { fill: #b33f19; stroke: #b33f19; }
.comparison-controls { display: flex; gap: .5rem; margin: .75rem 0; }
.comparison-panel[hidden] { display: none; }
@media (max-width: 700px) {
  .score-example { margin-inline: -.5rem; padding: .7rem; }
  .score-example .abc-rendered svg { min-width: 680px; }
  .score-example .abc-transport { position: sticky; left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .score-example * { scroll-behavior: auto !important; transition: none !important; }
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof ABCJS === "undefined") return;

  var Context = window.AudioContext || window.webkitAudioContext;
  var audioContext = null;
  var active = null;

  function clearHighlight(state) {
    state.el.querySelectorAll(".is-sounding").forEach(function (node) {
      node.classList.remove("is-sounding");
    });
  }

  function stop(state) {
    if (!state) return;
    state.cancelled = true;
    if (state.timer) window.clearTimeout(state.timer);
    if (state.synth) try { state.synth.stop(); } catch (_) {}
    if (state.timing) try { state.timing.stop(); } catch (_) {}
    clearHighlight(state);
    state.play.textContent = "Play";
    state.play.setAttribute("aria-pressed", "false");
    if (active === state) active = null;
  }

  function soundingEvent(state, event) {
    clearHighlight(state);
    if (!event || !event.elements) return;
    event.elements.flat().forEach(function (node) {
      if (node && node.classList) node.classList.add("is-sounding");
    });
  }

  async function play(state) {
    if (active === state) { stop(state); return; }
    stop(active);
    state.cancelled = false;
    state.play.disabled = true;
    state.play.textContent = "Loading…";
    state.status.textContent = "Preparing audio.";
    try {
      if (!audioContext) audioContext = new Context();
      if (audioContext.state === "suspended") await audioContext.resume();
      var voicesOff = state.mode === "bass" ? [0] : state.mode === "harmony" ? [1] : [];
      var synth = new ABCJS.synth.CreateSynth();
      await synth.init({
        visualObj: state.tune,
        audioContext: audioContext,
        // Chord symbols are an analytical map, not a third playback layer.
        // Only pitches explicitly written in RH and LH may sound.
        options: { voicesOff: voicesOff, chordsOff: true }
      });
      // prime() returns the duration of the audio that was actually built.
      // init() does not, and using it previously triggered a four-second
      // fallback that cut longer scores off mid-phrase.
      var result = await synth.prime();
      if (state.cancelled) return;
      state.synth = synth;
      active = state;
      state.play.disabled = false;
      state.play.textContent = "Stop";
      state.play.setAttribute("aria-pressed", "true");
      state.status.textContent = "Playing " + state.mode + ".";
      synth.start();
      state.timing = new ABCJS.TimingCallbacks(state.tune, {
        eventCallback: function (event) { soundingEvent(state, event); }
      });
      state.timing.start();
      if (result && Number.isFinite(result.duration)) {
        state.timer = window.setTimeout(function () {
          stop(state);
          state.status.textContent = "Playback finished.";
        }, result.duration * 1000 + 500);
      }
    } catch (error) {
      stop(state);
      state.play.disabled = true;
      state.status.textContent = "Audio is unavailable. The score and description remain usable.";
      console.error("score playback unavailable", error);
    }
  }

  document.querySelectorAll(".score-example").forEach(function (el) {
    var source = el.querySelector(".abc-source");
    var target = el.querySelector(".abc-rendered");
    if (!source || !target) return;
    var rhSource = source.textContent.split("[V:RH]")[1] || "";
    rhSource = rhSource.split("[V:LH]")[0];
    var bars = (rhSource.replace(/\|\]/g, "|").match(/\|/g) || []).length;
    var hasFixedSystems = source.textContent.indexOf("%%barsperstaff") !== -1;
    var scoreWidth = bars > 8 && !hasFixedSystems ? Math.max(900, bars * 135) : 760;
    var rendered = ABCJS.renderAbc(target, source.textContent, {
      staffwidth: scoreWidth, add_classes: true
    });
    if (!rendered[0]) return;
    if (bars > 8 && !hasFixedSystems) {
      var scoreSvg = target.querySelector("svg");
      if (scoreSvg) {
        scoreSvg.style.width = scoreWidth + "px";
        scoreSvg.style.minWidth = scoreWidth + "px";
        scoreSvg.style.maxWidth = "none";
      }
    }

    // abcjs sets its own inline overflow/height on the container for
    // layout purposes (seen even on scores that don't hit the bars>8
    // branch above, e.g. ones using %%barsperstaff that still don't fit
    // the requested staffwidth). That inline style wins over our
    // stylesheet's overflow-x:auto and silently clips the notation --
    // audio keeps playing, but part of the score becomes unviewable
    // with no way to reach it. Clear it unconditionally, then decide
    // scrollability from the actual measured overflow rather than the
    // bar-count heuristic above, so any current or future example that
    // renders wider than its box is caught automatically.
    target.style.overflow = "";
    target.style.overflowX = "auto";
    target.style.overflowY = "hidden";
    target.style.height = "";
    requestAnimationFrame(function () {
      if (target.scrollWidth > target.clientWidth + 1) {
        target.classList.add("is-scrollable");
        target.tabIndex = 0;
        var scoreTitle = (source.textContent.match(/^T:(.+)$/m) || [null, "music score"])[1];
        target.setAttribute("role", "region");
        target.setAttribute("aria-label", "Horizontally scrollable music score: " + scoreTitle);
      }
    });

    var controls = document.createElement("div");
    controls.className = "abc-transport";
    controls.innerHTML =
      '<button type="button" class="transport-play" aria-pressed="false">Play</button>' +
      '<button type="button" class="transport-mode" data-mode="full" aria-pressed="true">Full</button>' +
      '<button type="button" class="transport-mode" data-mode="bass" aria-pressed="false">Bass only</button>' +
      '<button type="button" class="transport-mode" data-mode="harmony" aria-pressed="false">Harmony only</button>' +
      '<span class="visually-hidden transport-status" aria-live="polite"></span>';
    var legacy = el.querySelector(".abc-play");
    if (legacy) legacy.remove();
    el.appendChild(controls);

    var state = {
      el: el, tune: rendered[0], synth: null, timing: null, timer: null, cancelled: false,
      mode: "full", play: controls.querySelector(".transport-play"),
      status: controls.querySelector(".transport-status")
    };
    if (!Context || !ABCJS.synth || !ABCJS.synth.supportsAudio()) {
      state.play.disabled = true;
      state.status.textContent = "Audio is not supported in this browser.";
    }
    state.play.addEventListener("click", function () { play(state); });
    controls.querySelectorAll(".transport-mode").forEach(function (button) {
      button.addEventListener("click", function () {
        stop(state);
        state.mode = button.dataset.mode;
        controls.querySelectorAll(".transport-mode").forEach(function (other) {
          other.setAttribute("aria-pressed", String(other === button));
        });
        state.status.textContent = button.textContent + " selected.";
      });
    });
  });

  document.querySelectorAll("[data-comparison-group]").forEach(function (group) {
    var panels = group.querySelectorAll(".comparison-panel");
    var buttons = group.querySelectorAll(".comparison-controls button");
    buttons.forEach(function (button) {
      button.addEventListener("click", function () {
        stop(active);
        var shown = null;
        panels.forEach(function (panel) {
          panel.hidden = panel.dataset.version !== button.dataset.version;
          if (!panel.hidden) shown = panel;
        });
        buttons.forEach(function (other) { other.setAttribute("aria-pressed", String(other === button)); });
        // A panel rendered while hidden measures 0-width, so the
        // overflow check above can't have caught a score that only
        // overflows once actually visible -- recheck now that it is.
        if (shown) {
          requestAnimationFrame(function () {
            shown.querySelectorAll(".abc-rendered").forEach(function (target) {
              if (target.scrollWidth > target.clientWidth + 1) {
                target.classList.add("is-scrollable");
                target.tabIndex = 0;
              }
            });
          });
        }
      });
    });
  });
});
</script>
